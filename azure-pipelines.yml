pool:
  vmImage: ubuntu-latest

parameters:
- name: projectsArray
  type: object
  default:
    - src/Codeworx.AspNetCore.Authentication.Introspection
- name: testProjectsArray
  type: object
  default:
    - test/Codeworx.AspNetCore.Authentication.Introspection.Tests

variables:
  major: 10
  minor: 0
  buildOffset: 0
  packageName: 'Codeworx.AspNetCore.Authentication.Introspection'
  projects: ${{ join(';',parameters.projectsArray) }}
  testProjects: ${{ join(';',parameters.testProjectsArray) }}
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'


stages:
- stage: Build
  displayName: "Build Nuget Packages"
  jobs:
  - job: Build
    steps:
    - task: DotNetCoreCLI@2
      displayName: "Install package-version tool"
      inputs:
        command: 'custom'
        custom: 'tool'
        arguments: 'install Codeworx.PackageVersion -g'

    - task: DotNetCoreCLI@2
      displayName: "Get next PackageVersion"
      inputs:
        command: 'custom'
        custom: 'package-version'
        arguments: '$(packageName) -m $(major) -n $(minor) -b $(buildOffset) -o DevOps -p $(prerelease)'

    - task: Bash@3
      displayName: "Update build version"
      inputs:
        targetType: 'inline'
        script: |
          # Write your commands here
          echo '##vso[build.updatebuildnumber]$(PackageVersion)'

    - task: DownloadSecureFile@1
      displayName: Download signing key
      inputs:
        secureFile: 'introspection_signkey.snk'

    - task: CopyFiles@2
      displayName: copy signing key
      inputs:
        SourceFolder: '$(Agent.TempDirectory)'
        Contents: 'introspection_signkey.snk'
        TargetFolder: './private'

    - task: DotNetCoreCLI@2
      displayName: "run dotnet test"
      inputs:
        command: 'test'
        projects: '$(testProjects)'
        arguments: '--configuration $(buildConfiguration)'

    - task: DotNetCoreCLI@2
      displayName: "run dotnet pack"
      inputs:
        command: 'pack'
        packagesToPack: '$(projects)'
        configuration: '$(buildConfiguration)'
        versioningScheme: 'off'
        packDirectory: '$(Build.ArtifactStagingDirectory)/packages'
        buildProperties: 'Version=$(PackageVersion);FileVersion=$(PackageVersionFileVersion);AssemblyVersion=$(major).0.0.0;SignAssembly=true;AssemblyOriginatorKeyFile=..\..\private\introspection_signkey.snk'

    - publish: '$(Build.ArtifactStagingDirectory)/packages'
      artifact: 'packages'

- stage: Publish
  displayName: "Publish to nuget.org"
  trigger: manual
  jobs:
  - deployment: push
    environment: Production
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: none

          - download: current
            artifact: 'packages'

          - task: DotNetCoreCLI@2
            inputs:
              command: 'push'
              packagesToPush: '$(Pipeline.Workspace)/packages/*.nupkg'
              nuGetFeedType: 'external'
              publishFeedCredentials: 'nuget.org'